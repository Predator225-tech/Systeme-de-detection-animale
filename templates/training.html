<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Entraînement YOLO</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    {% include 'sidebar.html' %}
    <div class="container">

        <h1>Module d'Entraînement YOLO</h1>
        <p><a href="{{ url_for('index') }}">← Retour à l'accueil</a></p>
        <hr>
        {% if message %}
        <div class="alert-box"><p>{{ message }}</p></div>
        {% endif %}
        <form method="POST" class="upload-form">
            <button type="submit" class="submit-btn">Lancer l'entraînement</button>
        </form>
    </div>
</body>
</html>
